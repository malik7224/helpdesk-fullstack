name: Helpdesk
options:
  bundleIdPrefix: dev.malik7224
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Helpdesk:
    type: application
    platform: iOS
    sources: [Helpdesk]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.malik7224.helpdesk
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Helpdesk/Info.plist
      properties:
        CFBundleDisplayName: Helpdesk
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Lets the app talk to a local API over http (localhost or a LAN address).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  HelpdeskTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HelpdeskTests]
    dependencies:
      - target: Helpdesk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.malik7224.helpdesk.tests
        GENERATE_INFOPLIST_FILE: YES
  HelpdeskUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HelpdeskUITests]
    dependencies:
      - target: Helpdesk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.malik7224.helpdesk.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Helpdesk:
    build:
      targets:
        Helpdesk: all
    test:
      targets: [HelpdeskTests]
  HelpdeskUI:
    build:
      targets:
        Helpdesk: all
    test:
      targets: [HelpdeskUITests]
