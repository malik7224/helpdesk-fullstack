name: iOS

on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["apps/mobile/**", ".github/workflows/ios.yml"]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and unit tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          for runtime, devices in json.load(sys.stdin)['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if d['name'].startswith('iPhone'):
                          print(d['udid']); sys.exit()
          ")
          echo "SIM_ID=$id" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          xcodebuild test \
            -project Helpdesk.xcodeproj \
            -scheme Helpdesk \
            -destination "id=$SIM_ID" \
            -quiet
